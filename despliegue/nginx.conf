# ------------------------------------------------------------------
# Nginx para Parques Industriales MX (build estático de Vite).
# Copiar a /etc/nginx/sites-available/parques y enlazar a sites-enabled.
# ------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name parques.tudominio.mx;

    root /var/www/parques;
    index index.html;

    # Compresión: reduce mucho el peso del JS y el CSS.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # CLAVE para React Router: si el archivo no existe en disco,
    # devolvemos index.html para que el router resuelva la ruta.
    # Sin esto, recargar /parque/abc o /admin da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre no cambian nunca: caché larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El service worker NO se debe cachear, o la PWA se queda pegada
    # en una versión vieja.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
